%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/samsung,exynos9825-usbdrd-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9825 USB DRD PHY

maintainers:
  - Linux Samsung SoC <linux-samsung-soc@vger.kernel.org>

properties:
  compatible:
    const: samsung,exynos9825-usbdrd-phy

  reg:
    maxItems: 1

  clocks:
    minItems: 8
    maxItems: 8

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the PMU system controller.

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - samsung,pmu-syscon
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    phy@10b00000 {
        compatible = "samsung,exynos9825-usbdrd-phy";
        reg = <0x10b00000 0x200>;
        clocks = <&cmu 1>, <&cmu 2>, <&cmu 3>, <&cmu 4>,
                 <&cmu 5>, <&cmu 6>, <&cmu 7>, <&cmu 8>;
        samsung,pmu-syscon = <&pmu_system_controller>;
        #phy-cells = <0>;
    };
...
