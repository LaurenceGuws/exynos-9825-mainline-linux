%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/maxim,max77705-muic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77705 micro USB interface controller

maintainers:
  - Linux Samsung SoC <linux-samsung-soc@vger.kernel.org>

description:
  The MAX77705 MUIC controls the USB D+/D- analog switch through the
  MAX77705 opcode I2C interface.

properties:
  compatible:
    const: maxim,max77705-muic

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        muic@25 {
            compatible = "maxim,max77705-muic";
            reg = <0x25>;
        };
    };
...
