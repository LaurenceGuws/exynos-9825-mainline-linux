%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/sec,sec-ts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Electronics SEC touchscreen controller

maintainers:
  - Linux Samsung SoC <linux-samsung-soc@vger.kernel.org>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: sec,sec_ts

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  avdd-supply: true
  dvdd-supply: true

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@48 {
            compatible = "sec,sec_ts";
            reg = <0x48>;
            interrupt-parent = <&gpio>;
            interrupts = <0 IRQ_TYPE_LEVEL_LOW>;
            touchscreen-size-x = <4096>;
            touchscreen-size-y = <4096>;
        };
    };
...
